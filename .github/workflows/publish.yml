name: Publier le site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # Sur une pull request : on vérifie seulement que le site se compile.
      - name: Vérifier la compilation
        if: github.event_name == 'pull_request'
        run: quarto render

      # Sur main : compilation puis publication sur la branche gh-pages.
      - name: Publier sur gh-pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
